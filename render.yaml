services:
  - type: web
    name: vigie-marches
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
  - type: web
    name: vigie-marches-dce
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /sante
    envVars:
      - key: NODE_VERSION
        value: "22"
