services:
  - type: web
    name: vigie-marches
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
  - type: web
    name: vigie-marches-dce
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /sante
    envVars:
      - key: NODE_VERSION
        value: "22"
      # comptes Vigie (server/comptes.js) ; base Postgres des comptes et sociétés (server/stockage.js, Neon gratuit par exemple)
      - key: DATABASE_URL
        sync: false
      - key: VIGIE_SECRET
        generateValue: true
      - key: VIGIE_CODE_INSTALLATION
        generateValue: true
      # clé d'API Render (facultative, gratuite) : sauvegarde automatique des comptes dans VIGIE_COMPTES
      - key: RENDER_API_KEY
        sync: false
      # « Mot de passe oublié » : envoi du lien par mail (compte Brevo gratuit, voir aide/comptes.html)
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_EXPEDITEUR
        sync: false
