<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vigie Marchés</title>
<style>
  :root{--bleu:#16337a;--bleu-fonce:#0d2257;--bleu-clair:#e8eefb;--rouge:#d22d39;--rouge-clair:#fdeced;--vert:#14603a;--gris:#5b6684;--blanc:#fff}
  body{margin:0;width:330px;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#14203d;background:var(--blanc)}
  header{background:var(--bleu);color:var(--blanc);padding:12px 14px;border-bottom:4px solid var(--rouge)}
  header h1{margin:0;font-size:15px}
  header p{margin:2px 0 0;font-size:12px;opacity:.85}
  main{padding:10px 14px 14px;display:grid;gap:8px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  li{display:flex;align-items:center;gap:8px;border:1px solid #dbe2f1;border-radius:8px;padding:7px 9px}
  li .nom{font-weight:600;flex:1}
  .etat{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px}
  .connecte{background:#e4f4ea;color:var(--vert)}
  .deconnecte{background:var(--rouge-clair);color:var(--rouge)}
  .injoignable,.attente{background:var(--bleu-clair);color:var(--gris)}
  a.btn{font-size:12px;font-weight:600;color:var(--bleu);border:1.5px solid var(--bleu);border-radius:6px;padding:3px 8px;text-decoration:none}
  a.btn:hover{background:var(--bleu-clair)}
  label{display:flex;gap:8px;align-items:flex-start;font-size:13px}
  input{accent-color:var(--bleu);margin-top:3px}
  .note{font-size:12px;color:var(--gris);margin:0}
  button{justify-self:start;background:var(--bleu);color:var(--blanc);border:0;border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header><h1>Vigie Marchés</h1><p>Vos sessions sur les plateformes d'achat public</p></header>
<main>
  <ul id="liste"><li><span class="nom">Vérification…</span></li></ul>
  <label><input type="checkbox" id="maintien" checked> Garder mes sessions ouvertes (visite discrète toutes les 10 minutes)</label>
  <button id="verifier" type="button">Vérifier à nouveau</button>
  <p class="note">Connectez-vous une fois sur chaque plateforme en cochant « Se souvenir de moi ». Vos identifiants restent dans votre navigateur : l'extension ne les lit pas et ne les envoie nulle part.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
